global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ms-transaction
    static_configs:
      - targets: ["ms_transaction:8000"]
  # Aparecerá DOWN hasta iniciar el perfil opcional ia; no tiene alerta de caída.
  - job_name: transaction-worker
    static_configs:
      - targets: ["transaction_worker:8001"]
  # También requiere el perfil ia.
  - job_name: ms-inference-ai
    static_configs:
      - targets: ["ms-inference-ai:8000"]
