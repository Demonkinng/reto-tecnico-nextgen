services:
  ms_transaction:
    build: ./ms-transaction
    image: nextgen-transaction:local
    environment: &transaction_environment
      DB_HOST: smartbancs_db
      DB_PORT: "5432"
      DB_NAME: smartbancs
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      DB_POOL_SIZE: "10"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      smartbancs_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  ms-inference-ai:
    build: ./ms-inference-ai
    image: nextgen-inference-ai:local
    environment:
      MOCK_DELAY_SECONDS: ${MOCK_DELAY_SECONDS:-0}
      MOCK_FAILURE_MODE: ${MOCK_FAILURE_MODE:-none}
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      # Liveness: permite probar 503 de recomendaciones sin impedir el arranque del worker.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  transaction_worker:
    build: ./ms-transaction
    image: nextgen-transaction:local
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *transaction_environment
      DB_POOL_SIZE: "2"
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ms-inference-ai:8000/recommendations}
      METRICS_PORT: "8001"
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      smartbancs_db:
        condition: service_healthy
      ms-inference-ai:
        condition: service_healthy
    stop_grace_period: 15s

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      ms_transaction:
        condition: service_healthy

  smartbancs_db:
    image: postgres:18.6

    environment:
      POSTGRES_DB: smartbancs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  prometheus_data:
