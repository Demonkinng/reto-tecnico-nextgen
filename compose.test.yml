name: nextgen-tests

services:
  test_db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: smartbancs_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d smartbancs_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  test_ai:
    build: ./ms-inference-ai
    image: nextgen-inference-ai:local
    profiles: ["pipeline"]
    environment:
      MOCK_DELAY_SECONDS: ${MOCK_DELAY_SECONDS:-0}
      MOCK_FAILURE_MODE: ${MOCK_FAILURE_MODE:-none}
    ports:
      - "127.0.0.1:${TEST_AI_PORT:-58002}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 10

  test_api:
    build: ./ms-transaction
    image: nextgen-transaction:local
    profiles: ["pipeline"]
    environment: &test_database
      DB_HOST: test_db
      DB_PORT: "5432"
      DB_NAME: smartbancs_test
      DB_USER: postgres
      DB_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:${TEST_API_PORT:-58000}:8000"
    depends_on:
      test_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 10

  test_worker:
    build: ./ms-transaction
    image: nextgen-transaction:local
    profiles: ["pipeline"]
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *test_database
      DB_POOL_SIZE: "2"
      AI_SERVICE_URL: http://test_ai:8000/recommendations
    depends_on:
      test_db:
        condition: service_healthy
      test_ai:
        condition: service_healthy
